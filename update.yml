name: Update schedule

on:
  schedule:
    # Минуты не «круглые»: на :00/:15/:30/:45 у GitHub самая высокая нагрузка, и запуски часто пропускаются
    - cron: '13 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-schedule
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - - name: Install Chromium
  run: npx playwright install chromium

      - name: Scrape DTEK
        run: node scraper.mjs
        env:
          QUEUE: '2.2'

      - name: Upload debug files on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: |
            debug.html
            debug.png
          if-no-files-found: ignore

      - name: Commit changes
        run: |
          git config user.name "schedule-bot"
          git config user.email "bot@users.noreply.github.com"
          git add schedule.json
          git diff --staged --quiet || (git commit -m "Update schedule" && git pull --rebase origin main && git push)
